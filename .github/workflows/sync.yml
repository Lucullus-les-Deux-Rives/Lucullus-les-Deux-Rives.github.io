
name: Synchronisation Notion - LDR.world

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "scripts/**"
      - ".github/workflows/sync.yml"
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ldr-world-pages
  cancel-in-progress: false

jobs:
  synchroniser:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperer les donnees Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/sync_notion.py

      - name: Preparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Envoyer les fichiers du site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Publier LDR.world
        id: deployment
        uses: actions/deploy-pages@v4
