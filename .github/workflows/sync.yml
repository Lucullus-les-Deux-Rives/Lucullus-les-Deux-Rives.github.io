
name: Synchronisation Notion - LDR.world

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "index.html"
      - "scripts/**"
      - "images/**"
      - ".github/workflows/sync.yml"

  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: ldr-world-pages
  cancel-in-progress: false

jobs:
  synchroniser:
    name: Synchroniser et publier LDR.world
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperer les donnees Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/sync_notion.py

      - name: Preparer les fichiers LDR.world
        shell: bash
        run: |
          set -e

          mkdir -p _site

          echo "Preparation de l'accueil..."
          cp index.html _site/index.html

          echo "Preparation des images GitHub..."
          if [ -d "images" ]; then
            cp -R images _site/images
          fi

          echo "Preparation des donnees Notion..."
          if [ ! -f "data/notion.json" ]; then
            echo "::error::Le fichier data/notion.json est absent"
            exit 1
          fi
          cp -R data _site/data

          echo "Preparation des medias Notion..."
          if [ -d "assets" ]; then
            cp -R assets _site/assets
          fi

          touch _site/.nojekyll

          echo "Verification des fichiers..."
          test -f _site/index.html
          test -f _site/data/notion.json
          test -f _site/images/catalogue.json

          echo "Verification du catalogue JSON..."
          python -m json.tool _site/images/catalogue.json > /dev/null

          echo "Fichiers prets :"
          du -sh _site
          find _site -type f | wc -l

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Envoyer le site vers GitHub Pages
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Attendre la disponibilite de l'archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          for tentative in $(seq 1 18); do
            echo "Verification de l'archive : $tentative/18"

            ARTIFACT_ID=$(gh api \
              "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" \
              --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' \
              2>/dev/null | head -n 1) || true

            if [ -n "$ARTIFACT_ID" ]; then
              echo "Archive disponible : $ARTIFACT_ID"
              exit 0
            fi

            sleep 10
          done

          echo "::error::Archive github-pages introuvable"
          exit 1

      - name: Publier LDR.world
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
