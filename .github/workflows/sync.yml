
name: Synchronisation Notion - LDR.world

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "index.html"
      - "scripts/**"
      - "data/**"
      - "images/**"
      - ".github/workflows/sync.yml"

  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: ldr-world-pages
  cancel-in-progress: false

jobs:

  # ========================================
  # JOB 1 - SYNCHRONISATION NOTION
  # ========================================

  synchroniser:
    name: Synchroniser Notion et preparer LDR.world

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperer les donnees Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          python scripts/sync_notion.py

      - name: Preparer les fichiers LDR.world
        shell: bash
        run: |
          set -e

          echo "Preparation de LDR.world"

          mkdir -p _site

          echo "Copie de l'accueil"
          cp index.html _site/index.html

          echo "Copie des images"
          if [ -d "images" ]; then
            cp -R images _site/images
          fi

          echo "Verification des donnees Notion"
          if [ ! -f "data/notion.json" ]; then
            echo "::error::data/notion.json est introuvable"
            exit 1
          fi

          echo "Copie des donnees Notion"
          cp -R data _site/data

          echo "Copie des medias Notion"
          if [ -d "assets" ]; then
            cp -R assets _site/assets
          fi

          touch _site/.nojekyll

          echo "Verification des fichiers"
          test -f _site/index.html
          test -f _site/data/notion.json
          test -f _site/data/agenda.json
          test -f _site/images/catalogue.json

          python -m json.tool \
            _site/data/notion.json > /dev/null

          python -m json.tool _site/data/agenda.json > /dev/null

          python -m json.tool \
            _site/images/catalogue.json > /dev/null

          echo "Taille du site"
          du -sh _site

          echo "Nombre de fichiers"
          find _site -type f | wc -l

          echo "Preparation terminee"

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Envoyer le site vers GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"
          name: github-pages

  # ========================================
  # JOB 2 - PUBLICATION GITHUB PAGES
  # ========================================

  publier:
    name: Publier LDR.world

    runs-on: ubuntu-latest

    needs: synchroniser

    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    timeout-minutes: 15

    steps:

      - name: Publier LDR.world
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

      - name: Publication terminee
        run: |
          echo "LDR.world a ete publie"
          echo "https://lucullus-les-deux-rives.github.io/"
